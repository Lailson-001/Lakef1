[project]
name = "lakef1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastf1>=3.8.3",
    "fastparquet>=2026.5.0",
    "numpy>=2.5.3",
    "pandas>=2.3.3",
    "requests>=2.34.2",
]

[project.scripts]
lakef1 = "lakef1:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakef1"]
